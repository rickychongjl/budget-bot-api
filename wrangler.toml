# budge-bot-api — one Cloudflare Worker holding the whole product.
#
# Single environment for this pass: PRODUCTION ONLY.
# Master plan §5.7 / M1 §6 — no staging Worker, no separate test bot token.
# Pre-merge testing relies on CI's per-PR ephemeral Neon branch + unit/integration tests.
#
# Secrets are NEVER committed here. Set them with `wrangler secret put <NAME>`:
#   TELEGRAM_BOT_TOKEN
#   TELEGRAM_WEBHOOK_SECRET
#   INTERNAL_DISPATCH_SECRET
#   OPENAI_API_KEY
#   DATABASE_URL          (postgres.js connection string for the Neon Sydney branch)

name = "budge-bot-api"
main = "src/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

workers_dev = true

[observability]
enabled = true

# Not a secret — the Worker's own public origin. The cron fan-out needs it because a
# `scheduled` invocation has no inbound request to derive an origin from, and the
# fan-out has to be a real subrequest so each send gets its own 10ms CPU budget.
#
# REPLACE before the first cron tick matters: the real subdomain is
# `<your-cloudflare-workers-subdomain>.workers.dev`, chosen once per Cloudflare
# account (visible on the Workers dashboard, or after the first `wrangler deploy`).
# `budge-bot-api.workers.dev` below is a placeholder, not a real reachable URL.
[vars]
WORKER_BASE_URL = "https://budge-bot-api.rickychongjl.workers.dev"

# Workers Cron Triggers — the only "background process" available on the Free plan.
# M5's daily-allowance scheduler runs every 15 minutes (Adelaide/Darwin are UTC+9:30,
# so an hourly tick would deliver a 07:00 message half an hour off). As of M7 stage 4A
# this drives the real fan-out: `findDue(scheduledTime, 50)` -> one subrequest to
# `/internal/send-allowance` per due user.
[triggers]
crons = ["*/15 * * * *"]

# Neon Postgres (Sydney) is reached through a Hyperdrive binding + postgres.js.
# Create the binding with:
#   wrangler hyperdrive create budge-bot-prod --connection-string "$DATABASE_URL"
# then paste its id below. Not a secret, but environment-specific.
[[hyperdrive]]
binding = "HYPERDRIVE"
id = "b57442266734436a9d0d61f459ff903d"
